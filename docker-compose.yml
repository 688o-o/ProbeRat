services:
  proberat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proberat
    image: proberat:v1.1.0
    ports:
      - "8001:8001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
